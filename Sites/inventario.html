<button id="IngresarEquipo">Ingresar Equipo</button>
<dialog class="Formulario" id="ModalEquipos">
  <button id="cerrarModal">Cerrar</button>
  <form method="dialog" action="http://localhost/SistemasCrew-Labs/api/admin/Equipos.php" id="equipoForm">
    <label for="codigo">Codigo Equipo:</label>
    <input type="text" id="codigo" name="codigo" required />

    <label for="categoria">Categoria:</label>
    <select id="categoria" name="categoria" required>
      <option value="">Seleccione una categoria</option>
    </select>

    <label for="ubicacion">Ubicación:</label>
    <select id="ubicacion" name="ubicacion" required>
      <option value="">Seleccione una ubicación</option>
    </select>

    <label for="estado">Estado:</label>
    <select id="estado" name="estado" required>
      <option value="">Seleccione un estado</option>
    </select>

    <label for="marca">Marca:</label>
    <input type="text" id="marca" name="marca" />

    <label for="modelo">Modelo:</label>
    <input type="text" id="modelo" name="modelo" />

    <label for="serie">Serie:</label>
    <input type="text" id="serie" name="serie" />

    <label for="descripcion">Descripcion:</label>
    <textarea id="descripcion" name="descripcion"></textarea>

    <button type="submit">Agregar Equipo</button>
  </form>
</dialog>
<dialog id="ModalPreview">
  <button type="button" id="cerrarPreview">Cerrar</button>
  <h2>Detalles del equipo</h2>
  <div id="DetalleEquipo">
  </div>
</dialog>
<div id="inventarioContainer">
  <table id="inventarioTable">
    <thead>
      <tr>
        <th>Codigo Equipo</th>
        <th>Descripción</th>
        <th>Categorias</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
  <div id="Paginacion"></div>
</div>
